<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Brand Orange Gradient for Badge Background -->
    <linearGradient id="cm_badge_orange" x1="250" y1="60" x2="250" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F98A00" />
      <stop offset="100%" stopColor="#EA7300" />
    </linearGradient>

    <!-- Deep Ocean / Navy Blue for Pets and Bottom Arc -->
    <linearGradient id="cm_pet_blue" x1="180" y1="120" x2="320" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0069A5" />
      <stop offset="100%" stopColor="#005080" />
    </linearGradient>
  </defs>

  <!-- 1. CIRCULAR ORANGE BADGE BACKGROUND -->
  <circle cx="250" cy="250" r="190" fill="url(#cm_badge_orange)" />

  <!-- 2. SMOOTH DEEP BLUE BOTTOM CRESCENT ARC -->
  <path
    d="M 96 335 
       A 190 190 0 0 0 404 335 
       C 370 415 315 440 250 440 
       C 185 440 130 415 96 335 Z"
    fill="url(#cm_pet_blue)"
  />

  <!-- 3. DIE-CUT THICK WHITE STICKER HALO (Encloses the pet trio against the orange circle) -->
  <path
    d="
      M 132 138 
      L 165 178 
      C 190 162 215 162 232 152 
      C 248 142 278 128 335 124 
      C 375 124 415 155 428 195 
      C 440 235 442 280 425 330 
      C 410 365 375 410 325 432 
      L 175 432 
      C 125 410 90 365 75 330 
      C 60 280 65 240 75 220 
      L 85 225 
      L 70 245 
      L 90 258 
      L 78 280 
      L 100 295 
      C 95 240 105 185 132 138 Z
    "
    fill="#FFFFFF"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- 4. CAT (LEFT MASCOT) -->
  <!-- Cat Head & Body Outer Silhouette (Blue) -->
