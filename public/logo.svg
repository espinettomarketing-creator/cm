  <polygon points="140,158 152,185 164,180" fill="#FFFFFF" opacity="0.9" />
  <polygon points="238,162 226,186 215,182" fill="#FFFFFF" opacity="0.9" />

  <!-- Cat White Blaze on Face (Extending from forehead down into fluffy chest bib) -->
  <path
    d="
      M 195 182 
      C 188 208 174 230 152 248 
      C 138 258 126 264 116 270 
      C 134 286 162 295 195 295 
      C 228 295 256 286 274 270 
      C 264 264 252 258 238 248 
