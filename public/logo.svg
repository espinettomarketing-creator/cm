  />

  <!-- Guinea Pig Cute Little Front Paws -->
  <path d="M 206 426 C 206 436 224 436 224 426 Z" fill="#0069A5" />
  <path d="M 276 426 C 276 436 294 436 294 426 Z" fill="#0069A5" />
  <polygon points="210,432 213,426 216,432 219,426 222,432" fill="#FFFFFF" />
  <polygon points="280,432 283,426 286,432 289,426 292,432" fill="#FFFFFF" />
