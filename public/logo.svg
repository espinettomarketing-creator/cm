  <!-- Dog Left Eye (on White Fur) -->
  <circle cx="312" cy="216" r="13" fill="#013A63" />
  <circle cx="315" cy="212" r="4" fill="#FFFFFF" />

  <!-- Dog Right Eye (Inside Blue Patch - White Ring with Dark Center, exactly as in uploaded logo!) -->
  <circle cx="392" cy="216" r="11" fill="#FFFFFF" />
  <circle cx="392" cy="216" r="6" fill="#013A63" />
  <circle cx="394" cy="214" r="2" fill="#FFFFFF" />

  <!-- Dog Big Friendly Oval Nose -->
  <ellipse cx="340" cy="265" rx="16" ry="12" fill="#013A63" />

  <!-- Dog Smiling Mouth & Tongue -->
  <path
    d="M 340 277 L 340 292 C 326 292 316 286 310 277 M 340 292 C 354 292 364 286 370 277"
