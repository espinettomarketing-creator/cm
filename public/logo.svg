    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 330 292 C 330 308 350 308 350 292 Z"
    fill="#FFFFFF"
    stroke="#013A63"
    stroke-width="3"
  />

  <!-- 6. GUINEA PIG (CENTER FOREGROUND MASCOT) -->
