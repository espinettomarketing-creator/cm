  <ellipse cx="250" cy="372" rx="76" ry="80" fill="#FFFFFF" stroke="#0069A5" stroke-width="4.5" />
  
  <!-- Fluffy Tufts on Left and Right -->
  <path d="M 180 355 L 165 370 L 184 380 L 168 395 L 188 405 Z" fill="#FFFFFF" />
  <path d="M 320 355 L 335 370 L 316 380 L 332 395 L 312 405 Z" fill="#FFFFFF" />

  <!-- Guinea Pig Folded Blue Ears -->
  <path d="M 198 312 C 192 302 216 298 225 316 C 215 322 202 322 198 312 Z" fill="#0069A5" />
  <path d="M 302 312 C 308 302 284 298 275 316 C 285 322 298 322 302 312 Z" fill="#0069A5" />

  <!-- Guinea Pig Eyes -->
  <circle cx="222" cy="342" r="9" fill="#013A63" />
  <circle cx="224" cy="340" r="3" fill="#FFFFFF" />
  
  <circle cx="278" cy="342" r="9" fill="#013A63" />
  <circle cx="280" cy="340" r="3" fill="#FFFFFF" />

  <!-- Guinea Pig Nose & 'Y' Mouth -->
  <path
    d="M 250 360 L 250 374 M 250 374 C 243 380 239 378 237 374 M 250 374 C 257 380 261 378 263 374"
    stroke="#013A63"
